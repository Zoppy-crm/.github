name: Validate Done Status

on:
  issues:
    types: [closed]

jobs:
  validate:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Validate required fields before Done
        env:
          GH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_REPO: ${{ github.event.repository.full_name }}
        run: python scripts/validate_done.py
