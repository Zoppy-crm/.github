name: Sync Rules to All Repos

on:
  push:
    branches: [development]
    paths:
      - 'rules/**'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Apenas listar repos sem fazer push'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync rules to repos based on config
        env:
          GH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          ORG="Zoppy-crm"
          CONFIG_FILE="rules/sync-config.json"
          BRANCHES=("master" "development" "staging" "mirror")
          DRY_RUN="${{ inputs.dry_run || 'false' }}"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Config file not found: $CONFIG_FILE"
            exit 1
          fi

          # Parse config and build repo -> folders mapping
          declare -A REPO_FOLDERS

          for group in $(jq -r '.groups | keys[]' "$CONFIG_FILE"); do
            folders=$(jq -r ".groups[\"$group\"].folders | join(\",\")" "$CONFIG_FILE")
            repos=$(jq -r ".groups[\"$group\"].repos[]" "$CONFIG_FILE")

            for repo in $repos; do
              if [ -n "${REPO_FOLDERS[$repo]:-}" ]; then
                REPO_FOLDERS[$repo]="${REPO_FOLDERS[$repo]},$folders"
              else
                REPO_FOLDERS[$repo]="$folders"
              fi
            done
          done

          echo "📦 Repos configurados: ${#REPO_FOLDERS[@]}"
          echo ""

          SYNCED=0
          SKIPPED=0
          FAILED=0

          for REPO in "${!REPO_FOLDERS[@]}"; do
            # Deduplicate folders
            IFS=',' read -ra RAW_FOLDERS <<< "${REPO_FOLDERS[$REPO]}"
            declare -A SEEN_FOLDERS
            FOLDERS=()
            for f in "${RAW_FOLDERS[@]}"; do
              if [ -z "${SEEN_FOLDERS[$f]:-}" ]; then
                SEEN_FOLDERS[$f]=1
                FOLDERS+=("$f")
              fi
            done
            unset SEEN_FOLDERS

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📂 $REPO ← [${FOLDERS[*]}]"

            if [ "$DRY_RUN" = "true" ]; then
              echo "  🔍 [DRY RUN] Would sync folders: ${FOLDERS[*]}"
              continue
            fi

            TMPDIR=$(mktemp -d)

            # Clone repo (shallow)
            if ! git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$ORG/$REPO.git" "$TMPDIR/$REPO" 2>/dev/null; then
              echo "  ❌ Failed to clone"
              FAILED=$((FAILED + 1))
              rm -rf "$TMPDIR"
              continue
            fi

            cd "$TMPDIR/$REPO"
            git config user.name "Zoppy Rules Bot"
            git config user.email "rules-bot@zoppy.com.br"

            REPO_SYNCED=false

            for BRANCH in "${BRANCHES[@]}"; do
              # Check if branch exists remotely
              if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
                continue
              fi

              # Fetch and checkout branch
              git fetch origin "$BRANCH" --depth 1 2>/dev/null
              git checkout -B "$BRANCH" "origin/$BRANCH" 2>/dev/null

              # Clean existing rules dir and rebuild with mapped folders
              rm -rf "rules"
              mkdir -p "rules"

              for folder in "${FOLDERS[@]}"; do
                SOURCE="$GITHUB_WORKSPACE/rules/$folder"
                if [ -d "$SOURCE" ]; then
                  cp -r "$SOURCE"/* "rules/" 2>/dev/null || true
                fi
              done

              # Check if there are changes
              if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard rules)" ]; then
                continue
              fi

              # Commit and push
              git add rules/
              git commit -m "chore: sync rules from .github [${FOLDERS[*]}]

Automated sync from Zoppy-crm/.github
Groups: ${FOLDERS[*]}
Triggered by: ${{ github.actor }}
Commit: ${{ github.sha }}"

              if git push origin "$BRANCH" 2>/dev/null; then
                echo "  🚀 $BRANCH — synced!"
                REPO_SYNCED=true
              else
                echo "  ❌ $BRANCH — push failed"
                FAILED=$((FAILED + 1))
              fi
            done

            if [ "$REPO_SYNCED" = true ]; then
              SYNCED=$((SYNCED + 1))
            else
              SKIPPED=$((SKIPPED + 1))
            fi

            cd "$GITHUB_WORKSPACE"
            rm -rf "$TMPDIR"
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Resultado:"
          echo "  ✅ Synced: $SYNCED repos"
          echo "  ⏭️  Skipped (no changes): $SKIPPED repos"
          echo "  ❌ Failed: $FAILED"
