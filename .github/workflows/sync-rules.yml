name: Sync Skills to All Repos

on:
    push:
        branches: [development]
        paths:
            - 'skills/**'
            # Os hooks sao distribuidos no mesmo passo (merge em .claude/settings.json).
            # Sem esta linha, mudanca so em hook nunca dispara a sync: fica parada ate
            # alguem empurrar uma skill e o hook pegar carona. Foi assim que os repos
            # ficaram meses mandando rodar uma skill que nao existe mais.
            - 'config/hooks-template.json'
            - 'scripts/sync-skills.sh'
            - '.github/workflows/sync-rules.yml'

    workflow_dispatch:
        inputs:
            repos:
                description: 'Repos para sincronizar (comma-separated, ou "all" para todos)'
                type: string
                default: 'all'
            dry_run:
                description: 'Apenas listar repos sem fazer push'
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Sync skills to repos based on config
              env:
                  GH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  set -uo pipefail

                  ORG="Zoppy-crm"
                  CONFIG_FILE="skills/sync-config.json"
                  DRY_RUN="${{ inputs.dry_run || 'false' }}"

                  if [ ! -f "$CONFIG_FILE" ]; then
                    echo "❌ Config file not found: $CONFIG_FILE"
                    exit 1
                  fi

                  source "$GITHUB_WORKSPACE/scripts/sync-skills.sh"
                  load_sync_config "$CONFIG_FILE" || exit 1

                  # Filter repos if specific ones requested
                  INPUT_REPOS="${{ inputs.repos || 'all' }}"
                  if [ "$INPUT_REPOS" != "all" ]; then
                    IFS=',' read -ra SELECTED <<< "$INPUT_REPOS"
                    declare -A SELECTED_MAP
                    for r in "${SELECTED[@]}"; do
                      SELECTED_MAP[$(echo "$r" | xargs)]=1
                    done
                    for repo in "${!REPO_FOLDERS[@]}"; do
                      if [ -z "${SELECTED_MAP[$repo]:-}" ]; then
                        unset "REPO_FOLDERS[$repo]"
                      fi
                    done
                    echo "🎯 Filtro ativo: ${SELECTED[*]}"
                  fi

                  echo "📦 Repos a sincronizar: ${#REPO_FOLDERS[@]}"
                  echo ""

                  SYNCED=0
                  SKIPPED=0
                  FAILED=0

                  for REPO in "${!REPO_FOLDERS[@]}"; do
                    # Deduplicate folders
                    IFS=',' read -ra RAW_FOLDERS <<< "${REPO_FOLDERS[$REPO]}"
                    declare -A SEEN_FOLDERS
                    FOLDERS=()
                    for f in "${RAW_FOLDERS[@]}"; do
                      if [ -z "${SEEN_FOLDERS[$f]:-}" ]; then
                        SEEN_FOLDERS[$f]=1
                        FOLDERS+=("$f")
                      fi
                    done
                    unset SEEN_FOLDERS

                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    SKILLS_PATH="${REPO_SKILLS_PATHS[$REPO]}"
                    mapfile -t BRANCHES < <(sync_target_branches "$REPO")
                    echo "📂 $REPO ← [${FOLDERS[*]}] → $SKILLS_PATH"

                    if [ "$DRY_RUN" = "true" ]; then
                      echo "  🔍 [DRY RUN] Would sync folders: ${FOLDERS[*]}"
                      continue
                    fi

                    SYNC_TMPDIR=$(mktemp -d)
                    REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/$ORG/$REPO.git"

                    # Clone repo with no checkout (just get .git)
                    if ! git clone --no-checkout "$REPO_URL" "$SYNC_TMPDIR/$REPO" 2>&1; then
                      echo "  ❌ Failed to clone"
                      FAILED=$((FAILED + 1))
                      rm -r -- "$SYNC_TMPDIR"
                      continue
                    fi

                    cd "$SYNC_TMPDIR/$REPO"
                    git config user.name "Zoppy Rules Bot"
                    git config user.email "rules-bot@zoppy.com.br"

                    REPO_SYNCED=false

                    for BRANCH in "${BRANCHES[@]}"; do
                      # Check if branch exists remotely
                      if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
                        continue
                      fi

                      # Fetch the specific branch and checkout
                      git fetch origin "$BRANCH" 2>&1 || continue
                      git checkout -f "$BRANCH" 2>&1 || git checkout -b "$BRANCH" "origin/$BRANCH" 2>&1 || continue

                      if ! bash "$GITHUB_WORKSPACE/scripts/sync-skills.sh" "$GITHUB_WORKSPACE" "$SKILLS_PATH" "${FOLDERS[@]}"; then
                        echo "  ❌ $BRANCH — falha no sync de skills"
                        FAILED=$((FAILED + 1))
                        continue
                      fi

                      # Merge hooks-template.json into .claude/settings.json
                      HOOKS_TEMPLATE="$GITHUB_WORKSPACE/config/hooks-template.json"
                      SETTINGS_FILE=".claude/settings.json"

                      if [ -f "$HOOKS_TEMPLATE" ]; then
                        mkdir -p ".claude"
                        if [ -f "$SETTINGS_FILE" ]; then
                          # Merge only the hooks key, preserving all other settings
                          jq --argjson hooksCfg "$(cat "$HOOKS_TEMPLATE")" \
                            '.hooks = ($hooksCfg.hooks * (.hooks // {}))' \
                            "$SETTINGS_FILE" > /tmp/settings-merged.json 2>/dev/null \
                            && mv /tmp/settings-merged.json "$SETTINGS_FILE" \
                            || cp "$HOOKS_TEMPLATE" "$SETTINGS_FILE"
                        else
                          cp "$HOOKS_TEMPLATE" "$SETTINGS_FILE"
                        fi
                        git add -f "$SETTINGS_FILE"
                      fi

                      # REVIEW.md na raiz: instruções do Code Review da Anthropic, que lê só
                      # CLAUDE.md e REVIEW.md. Cada pasta de stack (skills/<pasta>/REVIEW.md)
                      # traz o seu, apontando para as skills que aquele repo recebe.
                      REVIEW_SOURCES=()
                      for folder in "${FOLDERS[@]}"; do
                        [ -f "$GITHUB_WORKSPACE/skills/$folder/REVIEW.md" ] && REVIEW_SOURCES+=("$folder")
                      done
                      if [ "${#REVIEW_SOURCES[@]}" -gt 1 ]; then
                        echo "  ❌ $BRANCH — mais de uma pasta com REVIEW.md: ${REVIEW_SOURCES[*]}"
                        FAILED=$((FAILED + 1))
                        continue
                      fi
                      if [ "${#REVIEW_SOURCES[@]}" -eq 1 ]; then
                        cp "$GITHUB_WORKSPACE/skills/${REVIEW_SOURCES[0]}/REVIEW.md" REVIEW.md
                      fi

                      # Generate compiled copilot-instructions.md from all SKILL.md files
                      mkdir -p ".github"
                      {
                        echo "# Copilot Instructions — Zoppy"
                        echo ""
                        echo "> Auto-generated from $SKILLS_PATH/. Do not edit manually."
                        echo ""
                        for folder in "${FOLDERS[@]}"; do
                          SOURCE="$GITHUB_WORKSPACE/skills/$folder"
                          if [ -d "$SOURCE" ]; then
                            for skill_dir in "$SOURCE"/*/; do
                              if [ -d "$skill_dir" ] && [ -f "$skill_dir/SKILL.md" ]; then
                                skill_name=$(basename "$skill_dir")
                                echo "---"
                                echo ""
                                cat "$skill_dir/SKILL.md"
                                echo ""
                              fi
                            done
                          fi
                        done
                      } > ".github/copilot-instructions.md"

                      # Check if there are changes
                      # Include staged settings and ignored new files in the sync paths.
                      if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others -- "$SKILLS_PATH" .claude .github/copilot-instructions.md REVIEW.md)" ]; then
                        echo "  ✅ $BRANCH — já está atualizado"
                        continue
                      fi

                      # Commit and push (force-add so gitignored paths like .claude/settings.json still commit)
                      git add -fA "$SKILLS_PATH" .claude .github/copilot-instructions.md
                      [ -f REVIEW.md ] && git add -f REVIEW.md
                      git commit -m "chore: sync skills from .github [${FOLDERS[*]}]"

                      if git push origin "$BRANCH" 2>&1; then
                        echo "  🚀 $BRANCH — synced!"
                        REPO_SYNCED=true
                      else
                        echo "  ⚠️  $BRANCH — push blocked (check repository rulesets)"
                        FAILED=$((FAILED + 1))
                      fi
                    done

                    if [ "$REPO_SYNCED" = true ]; then
                      SYNCED=$((SYNCED + 1))
                    else
                      SKIPPED=$((SKIPPED + 1))
                    fi

                    cd "$GITHUB_WORKSPACE"
                    rm -r -- "$SYNC_TMPDIR"
                  done

                  echo ""
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "📊 Resultado:"
                  echo "  ✅ Synced: $SYNCED repos"
                  echo "  ⏭️  Skipped (no changes): $SKIPPED repos"
                  echo "  ❌ Failed: $FAILED"

                  [ "$FAILED" -eq 0 ]
