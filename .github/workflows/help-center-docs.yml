name: Central de Ajuda · rascunho (reutilizável)

# After a PR is merged into master, an agent reads it and, if the merchant notices the change, leaves
# a draft in the Zoppy Admin's Help Center. It never publishes. The skill (skills/shared/help-center-docs)
# reaches each repo through the skills sync. Caller, in each product repo:
#
#   on:
#       pull_request:
#           types: [closed]
#           branches: [master]
#   jobs:
#       rascunho:
#           if: github.event.pull_request.merged == true
#           uses: Zoppy-crm/.github/.github/workflows/help-center-docs.yml@development
#           secrets: inherit
#           permissions:
#               contents: read
#               pull-requests: write
#               id-token: write

on:
    workflow_call:
        secrets:
            CLAUDE_CODE_OAUTH_TOKEN:
                required: true
            # Lets the agent create drafts and nothing else (zoppy-api HelpCenterAgentTokenGuard).
            HELP_CENTER_AGENT_TOKEN:
                required: true

jobs:
    rascunho:
        if: github.event.pull_request.merged == true
        runs-on: self-hosted
        timeout-minutes: 30
        permissions:
            contents: read
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: anthropics/claude-code-action@v1
              env:
                  GH_TOKEN: ${{ github.token }}
                  HELP_CENTER_AGENT_TOKEN: ${{ secrets.HELP_CENTER_AGENT_TOKEN }}
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  prompt: '/help-center-docs ${{ github.event.pull_request.number }}'
                  claude_args: |
                      --model claude-opus-5-5
                      --max-turns 60
                      --allowedTools "Read,Glob,Grep,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(curl:*)"
