name: Cleanup merge-protection from repos

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Apenas listar repos sem alterar'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Disable enforce_admins and remove merge-protection.yml
        env:
          GH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail

          ORG="Zoppy-crm"
          FILE_PATH=".github/workflows/merge-protection.yml"
          BRANCHES=("master" "development" "staging" "mirror")
          DRY_RUN="${{ inputs.dry_run }}"
          SINCE=$(date -d '60 days ago' +%Y-%m-%dT%H:%M:%SZ)

          echo "🔍 Buscando repos ativos..."

          REPOS=$(gh api --paginate "/orgs/$ORG/repos?per_page=100&sort=pushed&direction=desc" \
            --jq ".[] | select(.archived == false) | select(.pushed_at > \"$SINCE\") | .name")

          FIXED=0
          DELETED=0
          FAILED=0

          for REPO in $REPOS; do
            if [ "$REPO" = ".github" ]; then
              continue
            fi

            # Step 1: Disable enforce_admins on all protected branches
            for BRANCH in "${BRANCHES[@]}"; do
              ENFORCED=$(gh api "/repos/$ORG/$REPO/branches/$BRANCH/protection" --jq '.enforce_admins.enabled' 2>/dev/null || true)

              if [ "$ENFORCED" = "true" ]; then
                echo "🔓 $REPO/$BRANCH — enforce_admins: true"

                if [ "$DRY_RUN" = "true" ]; then
                  echo "  🔍 [DRY RUN] Would disable enforce_admins"
                else
                  gh api -X DELETE "/repos/$ORG/$REPO/branches/$BRANCH/protection/enforce_admins" 2>/dev/null || true
                  echo "  ✅ enforce_admins disabled"
                fi
                FIXED=$((FIXED + 1))
              fi
            done

            # Step 2: Delete merge-protection.yml from ALL branches
            for BRANCH in "${BRANCHES[@]}"; do
              FILE_SHA=$(gh api "/repos/$ORG/$REPO/contents/$FILE_PATH?ref=$BRANCH" --jq '.sha' 2>/dev/null || true)

              if [ -z "$FILE_SHA" ] || echo "$FILE_SHA" | grep -q "message"; then
                continue
              fi

              echo "📂 $REPO/$BRANCH — found merge-protection.yml"

              if [ "$DRY_RUN" = "true" ]; then
                echo "  🔍 [DRY RUN] Would delete"
                DELETED=$((DELETED + 1))
                continue
              fi

              RESULT=$(gh api -X DELETE "/repos/$ORG/$REPO/contents/$FILE_PATH" \
                -f message="chore: remove merge-protection.yml (moved to org .github)" \
                -f sha="$FILE_SHA" \
                -f branch="$BRANCH" \
                -f "committer[name]=Zoppy Rules Bot" \
                -f "committer[email]=rules-bot@zoppy.com.br" 2>&1) || true

              if echo "$RESULT" | grep -q '"commit"'; then
                echo "  ✅ Deleted from $BRANCH!"
                DELETED=$((DELETED + 1))
              else
                echo "  ❌ Failed on $BRANCH: $RESULT"
                FAILED=$((FAILED + 1))
              fi
            done
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Resultado:"
          echo "  🔓 enforce_admins disabled: $FIXED branches"
          echo "  🗑️  Files deleted: $DELETED repos"
          echo "  ❌ Failed: $FAILED"
