name: "Refinamento Técnico"
description: "Template para refinamento técnico de features e tarefas"
labels: ["refinement", "work: feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Resumo da Solução
      description: "Descreva o cenário atual. Qual o problema que precisa ser resolvido? (Ponto de partida)"
      placeholder: "Ex: Hoje o sistema não envia notificações push para usuários inativos..."
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: "Descreva como o problema será resolvido. (Ponto de chegada)"
      placeholder: "Ex: Implementar um worker que identifica usuários inativos e dispara push via FCM..."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Critérios de Aceite
      description: "Quais critérios o card precisa atender para considerar a conclusão da tarefa"
      placeholder: |
        - [ ] Critério 1
        - [ ] Critério 2
        - [ ] Critério 3
    validations:
      required: true

  - type: textarea
    id: layout
    attributes:
      label: Layout
      description: "Protótipos elaborados pelo time de design (cole links do Figma ou imagens)"
      placeholder: "Link do Figma ou arraste imagens aqui"
    validations:
      required: false

  - type: textarea
    id: technical-details
    attributes:
      label: Detalhamento Técnico
      description: "Detalhe os lugares em que será necessário atuar. Quanto mais detalhe, melhor"
      placeholder: |
        **Arquivos/Módulos impactados:**
        -

        **Endpoints novos/alterados:**
        -

        **Banco de dados:**
        -

        **Dependências externas:**
        -
    validations:
      required: false

  - type: textarea
    id: affected-services
    attributes:
      label: Serviços Afetados
      description: "Liste os serviços que serão alterados. Inclua shared packages se aplicável"
      placeholder: |
        Ex: zoppy-api (API/PVT/WORKER), zoppy-event-bridge, zoppy-workflow, zoppy-FE, zoppy-workflow-FE, ui-components.
        Shared packages: @Zoppy-crm/models, @Zoppy-crm/shared, @Zoppy-crm/api-signatures, etc.
    validations:
      required: false

  - type: textarea
    id: migrations
    attributes:
      label: Migrations
      description: "Scripts de migration necessários (Sequelize CLI / Cassandra)"
      placeholder: |
        Para cada migration: nome do arquivo, tipo de operação (create table, alter table, add column, etc.) e breve descrição do impacto.
    validations:
      required: false

  - type: textarea
    id: infrastructure
    attributes:
      label: Infraestrutura
      description: "Mudanças necessárias em infraestrutura"
      placeholder: |
        Novos buckets ou políticas no S3, configurações de Redis, novas filas BullMQ, variáveis de ambiente, permissões IAM, etc.
        Deixar em branco se não aplicável.
    validations:
      required: false

  - type: textarea
    id: endpoint-permissions
    attributes:
      label: Permissões de Endpoints
      description: "Mapeamento de permissões por endpoint novo ou alterado"
      placeholder: |
        | Rota | Método | Guards | Níveis de acesso |
        |------|--------|--------|-------------------|
        | /api/example | GET | RoleGuard, FeatureGuard | Master / Admin |
    validations:
      required: false

  - type: textarea
    id: retroactive-data-jobs
    attributes:
      label: Jobs de Correção de Dados Retroativos
      description: "Scripts ou jobs necessários para migração ou correção de dados históricos após o deploy"
      placeholder: |
        Informar: origem dos dados, lógica de transformação, critério de elegibilidade e estratégia de execução (one-shot, paginado, etc.).
        Deixar em branco se não aplicável.
    validations:
      required: false

  - type: textarea
    id: monitoring
    attributes:
      label: Monitoramento e Observabilidade
      description: "Métricas, alertas e dashboards a serem criados ou atualizados"
      placeholder: |
        Fonte de dados (MySQL RDS para operacional, Athena para analítico), logs estruturados relevantes (Loki) e quem deve ser notificado em caso de anomalia.
    validations:
      required: false

  - type: input
    id: feature-flag
    attributes:
      label: Feature Flag
      description: "Nome da feature flag (se aplicável)"
      placeholder: "Ex: ENABLE_PUSH_NOTIFICATIONS"
    validations:
      required: false

  - type: textarea
    id: test-plan
    attributes:
      label: Roteiro de Teste
      description: "Detalhe o fluxo de teste que o QA deve seguir"
      placeholder: |
        **Telas:**
        -

        **Rotinas:**
        -

        **Locais de impacto:**
        -

        **Resultado Esperado:**
        -
    validations:
      required: false

  - type: textarea
    id: e2e-tests
    attributes:
      label: Testes E2E (Playwright)
      description: "Cenários end-to-end que precisam de cobertura via Playwright (API e/ou Frontend). Novas features devem ter boa cobertura E2E"
      placeholder: |
        **Frontend:**
        - Fluxo: Login → Dashboard → Criar Recurso
        - Fluxo: Carrinho → Checkout → Pagamento

        **API:**
        - Fluxo: CRUD completo de /endpoint
        - Fluxo: Webhook → Processamento → Persistência
    validations:
      required: false

  - type: dropdown
    id: ai-assisted
    attributes:
      label: Criado com auxílio de IA?
      description: "Esse card foi gerado ou co-criado usando Claude, Cursor ou outra ferramenta de IA?"
      options:
        - Sim
        - Não
    validations:
      required: true
