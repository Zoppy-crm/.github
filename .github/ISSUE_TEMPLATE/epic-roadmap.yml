name: "Epic de Roadmap"
description: "Template para épicos de produto rastreados no roadmap"
labels: ["epic", "roadmap"]
body:
  - type: textarea
    id: why
    attributes:
      label: Por que estamos fazendo isso?
      description: "Contexto e motivação de negócio. Qual problema ou oportunidade justifica este épico?"
      placeholder: "Ex: A funcionalidade X é uma das mais usadas da Zoppy — identificamos gaps importantes após o lançamento..."
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: O que estamos resolvendo?
      description: "Descreva as iniciativas deste épico. Use subtítulos com emoji para organizar por tema."
      placeholder: |
        ### 🖥️ Usabilidade e interface
        ...

        ### 📐 Novos operadores e filtros
        ...
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: O que está fora do escopo?
      description: "O que explicitamente NÃO será feito neste épico."
      placeholder: "Ex: Redesign completo da tela ou mudanças na engine de cálculo. Este épico foca em melhorias incrementais."
    validations:
      required: true
